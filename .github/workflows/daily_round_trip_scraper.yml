name: Daily 12:00 PM Round-Trip Flight Scraper & Supabase Sync

on:
  schedule:
    # Runs every day at 12:00 PM UTC
    - cron: '0 12 * * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      limit_routes:
        description: 'Limit number of routes to scan (e.g. 5, 20, or leave empty for all 250)'
        required: false
        default: ''
      departure_days:
        description: 'Departure days ahead to look (default: 30)'
        required: false
        default: '14'
      return_window:
        description: 'Max return days window [1..14] (default: 14)'
        required: false
        default: '14'

jobs:
  scrape-round-trip-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: round-trip

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Round-Trip Google Flights Scraper
        env:
          HEADLESS: "true"
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST || 'aws-0-eu-west-1.pooler.supabase.com' }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD || 'OlcvPogBrneuhYW7' }}
          SUPABASE_ROUND_TRIP_USER: ${{ secrets.SUPABASE_ROUND_TRIP_USER || 'postgres.afqmwnbuvsothamcbdpv' }}
        run: |
          CMD="python run_250_routes_round_trip.py"
          if [ -n "${{ github.event.inputs.limit_routes }}" ]; then
            CMD="$CMD --limit ${{ github.event.inputs.limit_routes }}"
          fi
          if [ -n "${{ github.event.inputs.departure_days }}" ]; then
            CMD="$CMD --days ${{ github.event.inputs.departure_days }}"
          fi
          if [ -n "${{ github.event.inputs.return_window }}" ]; then
            CMD="$CMD --return-window ${{ github.event.inputs.return_window }}"
          fi
          echo "Executing: $CMD"
          eval $CMD

